readme = "README.md"
authors = [
    { name = "LAWAGGG", email = "ahmadfagih.arrifai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.142.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
    "google-genai>=2.28.0",
    "gspread>=6.2.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-telegram-bot>=22.8",
    "sqlalchemy>=2.1.3",
